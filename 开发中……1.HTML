<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小桌宠">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<title>像素桌宠</title>
<style>
:root{
  --panel:#1d1d24; --line:#3a3a44; --text:#d7d3cc; --dim:#8a8a94;
  --accent:#e5977c; --pink:#ff9ec4; --bg:#17171b;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Courier New',ui-monospace,monospace;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation;
}
body{position:fixed;inset:0}
#stage{position:relative;width:100%;height:100%;overflow:hidden}

.sparkle{position:absolute;pointer-events:none;z-index:0;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

#topbar{
  position:absolute;top:calc(8px + var(--safe-t));left:0;right:0;z-index:5;
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:0 10px;pointer-events:none;
}
#topbar>*{pointer-events:auto}
#hud{
  background:rgba(29,29,36,.88);border:2px solid var(--line);
  padding:7px 10px;font-size:11px;letter-spacing:1px;color:var(--dim);max-width:64vw;
}
#hud .line1{margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud b{color:var(--pink);font-weight:normal}
#hud i{color:var(--accent);font-style:normal}
.bar{width:100%;min-width:96px;height:8px;background:#101015;border:2px solid var(--line)}
.bar span{display:block;height:100%;width:0;background:var(--pink);transition:width .4s ease-out}
#hud-next{margin-top:5px;font-size:10px;color:#55555c;letter-spacing:0}
#hud-days{margin-top:5px;font-size:10px;color:#7f7f8c;letter-spacing:0}
#hud-days b{color:var(--accent)}
#btn-wardrobe{
  flex:0 0 auto;width:46px;height:46px;font-size:20px;line-height:1;
  background:var(--panel);border:2px solid var(--line);color:var(--text);cursor:pointer;
}
#btn-wardrobe.on{border-color:var(--accent)}

#pet{
  position:absolute;left:50%;top:44%;width:112px;height:84px;
  translate:-50% -50%;transform:scaleX(var(--face,1));
  transition:transform .18s steps(2),top .28s ease;
  z-index:2;cursor:pointer;touch-action:none;
}
#stage.sheet-open #pet{top:23%}
.flip{position:absolute;inset:0}
.bob{width:100%;height:100%;animation:idleBob 2.4s ease-in-out infinite}
.sprite{display:block;width:100%;height:100%;image-rendering:pixelated}

#pet .shadow{
  position:absolute;left:50%;top:calc(100% - 7px);
  width:58px;height:9px;translate:-50% 0;background:rgba(0,0,0,.5);
  animation:shadowPulse 2.4s ease-in-out infinite;
}
@keyframes shadowPulse{0%,100%{opacity:.55;transform:scaleX(1)}50%{opacity:.45;transform:scaleX(.94)}}
#pet.jump .shadow{animation:shadowHop .42s ease-out}
@keyframes shadowHop{0%{transform:scaleX(1);opacity:.55}40%{transform:scaleX(.7);opacity:.3}100%{transform:scaleX(1);opacity:.55}}

@keyframes idleBob {0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes hop     {0%{transform:translateY(0)}40%{transform:translateY(-20px)}100%{transform:translateY(0)}}
@keyframes happyHop{0%{transform:translateY(0)}30%{transform:translateY(-24px)}55%{transform:translateY(0)}72%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes breathe {0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes shake   {0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes typeBob {0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes swap    {0%{transform:translateY(0) scaleY(1)}35%{transform:translateY(-7px) scaleY(1.08)}70%{transform:translateY(0) scaleY(.93)}100%{transform:translateY(0) scaleY(1)}}
@keyframes spinIt{
  0%{transform:translateY(0) scaleX(1)}18%{transform:translateY(-9px) scaleX(.12)}
  36%{transform:translateY(0) scaleX(-1)}54%{transform:translateY(-9px) scaleX(-.12)}
  72%{transform:translateY(0) scaleX(1)}86%{transform:translateY(-4px) scaleX(1)}100%{transform:translateY(0) scaleX(1)}
}
@keyframes nuzzleIt{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-5px,1px) rotate(-5deg)}40%{transform:translate(0,0) rotate(0)}
  60%{transform:translate(5px,1px) rotate(5deg)}80%{transform:translate(0,0) rotate(0)}
}
@keyframes hugIt{
  0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-7px) scale(1.1,.92)}
  55%{transform:translateY(0) scale(.94,1.08)}78%{transform:translateY(-3px) scale(1.04,.98)}
  100%{transform:translateY(0) scale(1,1)}
}
@keyframes armHugL{0%,100%{transform:translate(0,0)}35%,75%{transform:translate(2.5px,-3.5px)}}
@keyframes armHugR{0%,100%{transform:translate(0,0)}35%,75%{transform:translate(-2.5px,-3.5px)}}
@keyframes danceIt{
  0%{transform:translate(0,0) rotate(0) scaleY(1)}
  12%{transform:translate(-6px,-7px) rotate(-6deg)}25%{transform:translate(0,0) rotate(0) scaleY(.9)}
  37%{transform:translate(6px,-7px) rotate(6deg)}50%{transform:translate(0,0) rotate(0) scaleY(1.06)}
  62%{transform:translate(-6px,-7px) rotate(-6deg)}75%{transform:translate(0,0) rotate(0) scaleY(.92)}
  87%{transform:translate(6px,-7px) rotate(6deg)}100%{transform:translate(0,0) rotate(0) scaleY(1)}
}
@keyframes fireIt{
  0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(-4px) scale(1.06,.92)}
  40%{transform:translateY(-26px) scale(.94,1.1)}72%{transform:translateY(-4px) scale(1.05,.95)}
  100%{transform:translateY(0) scale(1,1)}
}
@keyframes chewIt{
  0%{transform:translateY(0) scale(1,1)}
  12%{transform:translateY(-4px) scale(1.06,.94)}26%{transform:translateY(0) scale(.95,1.07)}
  40%{transform:translateY(-4px) scale(1.06,.94)}54%{transform:translateY(0) scale(.95,1.07)}
  68%{transform:translateY(-3px) scale(1.04,.96)}82%{transform:translateY(0) scale(.98,1.03)}
  100%{transform:translateY(0) scale(1,1)}
}
@keyframes sipIt{
  0%{transform:translateY(0) scale(1,1)}
  30%{transform:translateY(-2px) scale(1.03,.97)}
  60%{transform:translateY(1px) scale(.98,1.02)}
  100%{transform:translateY(0) scale(1,1)}
}
@keyframes kissShyIt{
  0%{transform:translate(0,0) scale(1,1)}
  18%{transform:translate(-3px,-8px) scale(.92,1.1)}
  38%{transform:translate(7px,0) scale(1.05,.95)}
  58%{transform:translate(-2px,-2px) scale(.98,1.02)}
  100%{transform:translate(0,0) scale(1,1)}
}
@keyframes kissHappyIt{
  0%{transform:translateY(0) scale(1,1)}
  22%{transform:translateY(-3px) scale(1.08,.92)}
  50%{transform:translateY(0) scale(.95,1.05)}
  74%{transform:translateY(-5px) scale(1.03,.97)}
  100%{transform:translateY(0) scale(1,1)}
}
@keyframes kissFreezeIt{
  0%{transform:translateY(0) scale(1,1)}
  30%{transform:translateY(-2px) scale(1.02,.98)}
  70%{transform:translateY(-2px) scale(1.02,.98)}
  100%{transform:translateY(0) scale(1,1)}
}

#pet.jump   .bob{animation:hop .42s ease-out}
#pet.wiggle .bob{animation:happyHop .52s ease-out}
#pet.angry  .bob{animation:shake .32s ease-in-out 3}
#pet.sleep  .bob{animation:breathe 1.8s ease-in-out infinite}
#pet.typing .bob{animation:typeBob .9s ease-in-out infinite}
#pet.swap   .bob{animation:swap .5s ease-out}
#pet.eat    .bob{animation:chewIt 1.5s ease-out}
#pet.sip    .bob{animation:sipIt 1.6s ease-in-out}
#pet.spin     .bob{animation:spinIt 1.1s ease-in-out}
#pet.nuzzle   .bob{animation:nuzzleIt 1.4s ease-in-out}
#pet.hug      .bob{animation:hugIt 1.6s ease-out}
#pet.hug      .arm-l{animation:armHugL 1.6s ease-out}
#pet.hug      .arm-r{animation:armHugR 1.6s ease-out}
#pet.dance    .bob{animation:danceIt 1.7s ease-in-out 2}
#pet.dance    .arm-l{animation:armTap .35s ease-in-out infinite alternate}
#pet.dance    .arm-r{animation:armTap .35s ease-in-out infinite alternate-reverse}
#pet.firework .bob{animation:fireIt 1.2s ease-out 2}
#pet.kissshy    .bob{animation:kissShyIt .9s ease-out}
#pet.kisshappy  .bob{animation:kissHappyIt 1.2s ease-out}
#pet.kissfreeze .bob{animation:kissFreezeIt 1.4s ease-out}

.outfit,.acc{display:none}
#pet[data-outfit="maid"]   .o-maid,
#pet[data-outfit="butler"] .o-butler,
#pet[data-outfit="sailor"] .o-sailor,
#pet[data-outfit="school"] .o-school,
#pet[data-outfit="gym"]    .o-gym,
#pet[data-outfit="yukata"] .o-yukata,
#pet[data-outfit="santa"]  .o-santa,
#pet[data-outfit="witch"]  .o-witch,
#pet[data-outfit="pajama"] .o-pajama,
#pet[data-prop="duster"]   .a-duster{display:block}

/* 腮红:类名必须叫 .cheek,不能叫 .blush(会撞 #pet 的状态类) */
.cheek{opacity:0;transition:opacity .25s}
#pet.blush .cheek{opacity:.9}

.eye{
  transform-box:fill-box;transform-origin:center;
  transform:translate(var(--ex,0px),var(--ey,0px)) scaleY(var(--eye-open,1));
  transition:transform .09s ease-out,fill .18s;
}
#pet.blink{--eye-open:.12}
#pet.sleep{--eye-open:.14}
#pet.loved{--eye-open:.32}
#pet.typing{--eye-open:.7}
#pet.angry{--eye-open:.85}
#pet.nuzzle{--eye-open:.35}
#pet.hug{--eye-open:.4}
#pet.spin{--eye-open:.85}
#pet.eat{--eye-open:.45}
#pet.sip{--eye-open:.18}
#pet.kissshy{--eye-open:1.2}
#pet.kisshappy{--eye-open:.15}
#pet.kissfreeze{--eye-open:1}
#pet.angry .eye{fill:#3a1a10}

.brow{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .12s}
.brow-l{transform:rotate(12deg)}
.brow-r{transform:rotate(-12deg)}
#pet.angry .brow{opacity:1}

.arm{transform-box:fill-box;transform-origin:top center}
#pet.typing .arm-l{animation:armTap .28s ease-in-out infinite alternate}
#pet.typing .arm-r{animation:armTap .28s ease-in-out infinite alternate-reverse}
@keyframes armTap{from{transform:translateY(0)}to{transform:translateY(2.5px)}}

.fx{
  position:absolute;z-index:3;pointer-events:none;font-size:13px;font-weight:bold;
  line-height:1;transform:translate(-50%,0);animation:floatUp 1.4s ease-out forwards;
}
.fx.zzz{color:#9aa0ff;font-size:14px}
.fx.heart{color:#ff5fa6;font-size:16px}
.fx.rage{color:#ff6b5f;font-size:15px}
.fx.code{color:#6fe3c8}
.fx.note{color:#d6a8ff;font-size:16px}
.fx.kiss{color:#ff8fa8;font-size:15px}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,6px) scale(.6)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1.15)}
}
.burst{position:absolute;width:4px;height:4px;z-index:3;pointer-events:none;animation:burstOut .65s ease-out forwards}
.burst.big{width:5px;height:5px;animation-duration:.95s}
@keyframes burstOut{
  0%{opacity:1;transform:translate(-50%,-50%)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))}
}
.puff{
  position:absolute;width:7px;height:7px;border-radius:50%;z-index:3;pointer-events:none;
  background:rgba(207,227,239,.7);animation:puffUp 1.2s ease-out forwards;
}
@keyframes puffUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.6)}
  30%{opacity:.9}
  100%{opacity:0;transform:translate(-50%,-34px) scale(1.5)}
}
.gainfx{position:absolute;z-index:6;pointer-events:none;font-size:11px;color:var(--pink);animation:gainUp .9s ease-out forwards}
@keyframes gainUp{0%{opacity:0;transform:translateY(2px)}25%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}

.snack{position:absolute;z-index:4;pointer-events:none;translate:-50% 0;
  font-size:26px;line-height:1;animation:snackDrop .6s ease-in forwards}
@keyframes snackDrop{
  0%{opacity:0;transform:translateY(-32px) scale(.7)}
  35%{opacity:1}
  70%{opacity:1;transform:translateY(24px) scale(1)}
  100%{opacity:0;transform:translateY(34px) scale(.5)}
}
.kissfly{
  position:absolute;z-index:4;pointer-events:none;font-size:25px;line-height:1;
  translate:-50% 0;animation:kissFly .7s ease-out forwards;
}
@keyframes kissFly{
  0%{opacity:0;transform:translate(0,44px) scale(.6) rotate(-20deg)}
  45%{opacity:1;transform:translate(0,0) scale(1.2) rotate(0deg)}
  70%{transform:translate(0,-2px) scale(1)}
  100%{opacity:0;transform:translate(0,-12px) scale(.7)}
}

#bubble{
  position:absolute;z-index:3;pointer-events:none;translate:-50% -100%;
  padding:6px 9px;background:var(--panel);border:2px solid var(--line);
  font-size:12px;line-height:1;white-space:nowrap;opacity:0;transition:opacity .16s;
}
#bubble.show{opacity:1}

#toast{
  position:absolute;left:50%;top:calc(96px + var(--safe-t));translate:-50% 0;z-index:6;
  padding:12px 18px;text-align:center;background:rgba(29,29,36,.97);
  border:2px solid var(--accent);box-shadow:0 0 0 4px rgba(229,151,124,.12);
  animation:toastIn .45s ease-out;max-width:88vw;
}
#toast.hide{display:none}
#toast-title{font-size:12px;color:var(--accent);letter-spacing:2px;margin-bottom:8px}
#toast-body{font-size:13px;line-height:1.5}
@keyframes toastIn{0%{opacity:0;transform:translateY(-16px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}

#panel{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  display:flex;flex-direction:column;gap:7px;
  padding:10px 10px calc(10px + var(--safe-b));
  background:linear-gradient(180deg,rgba(23,23,27,0) 0%,rgba(23,23,27,.9) 34%,rgba(23,23,27,.98) 100%);
}
.wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.chips{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:40px;padding:0 14px;display:flex;align-items:center;gap:4px;
  font-family:inherit;font-size:12px;color:var(--text);background:#1a1a20;
  border:2px solid var(--line);cursor:pointer;white-space:nowrap;
}
.chip.on{border-color:#6fe3c8;color:#6fe3c8}
.chip.locked{border-style:dashed;color:#5c5c66;border-color:#33333c}
.chip.unlocked{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.85)}45%{transform:scale(1.14)}100%{transform:scale(1)}}

.acts{display:flex;gap:4px}
.act{
  flex:1 1 0;min-width:0;min-height:58px;padding:6px 0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:inherit;font-size:9px;line-height:1.1;color:var(--text);
  background:var(--panel);border:2px solid var(--line);cursor:pointer;transition:opacity .2s;
}
.act .ico{font-size:18px;line-height:1}
.act.on{border-color:#6fe3c8;color:#6fe3c8}
.act:active,.chip:active{transform:translateY(1px)}

#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:8;
  max-height:64%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 12px calc(18px + var(--safe-b));
  background:var(--panel);border-top:2px solid var(--line);
  transform:translateY(105%);transition:transform .26s ease-out;
  box-shadow:0 -10px 30px rgba(0,0,0,.45);
}
#sheet.open{transform:translateY(0)}
.sheet-inner{max-width:560px;margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-head .t{font-size:13px;letter-spacing:3px;color:var(--accent)}
.wtitle{font-size:10px;color:#6a6a75;letter-spacing:3px;margin:14px 0 7px}
.wtitle:first-of-type{margin-top:4px}
.mini{min-height:38px;padding:0 14px;font-family:inherit;font-size:12px;
  background:#1a1a20;border:2px solid var(--line);color:var(--text);cursor:pointer}
.mini.danger{color:#ff8f8f;border-color:#5a3333}
.mini.wide{width:100%;min-height:46px}
.mini.accent{color:var(--accent);border-color:var(--accent)}

.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.snack-btn{
  position:relative;min-height:66px;display:flex;align-items:center;gap:9px;
  padding:8px 10px;font-family:inherit;font-size:12px;color:var(--text);
  background:#1a1a20;border:2px solid var(--line);cursor:pointer;text-align:left;
  transition:opacity .2s;
}
.snack-btn:active{transform:translateY(1px)}
.snack-btn .s-ico{font-size:24px;line-height:1;flex:0 0 auto}
.snack-btn .s-txt{display:flex;flex-direction:column;gap:4px;line-height:1.1;min-width:0}
.snack-btn .s-val{font-size:10px;color:var(--pink)}
.snack-btn .s-cd{position:absolute;right:8px;bottom:6px;font-size:10px;color:#6a6a75}
.snack-btn.cooling{opacity:.42}

.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.wgrid button{
  min-height:46px;display:flex;align-items:center;gap:8px;justify-content:flex-start;
  padding:0 12px;font-family:inherit;font-size:12px;color:var(--text);
  background:#1a1a20;border:2px solid var(--line);cursor:pointer;
}
.wgrid button.sel{border-color:var(--accent);color:var(--accent);background:#2a2020}
.swatch{width:12px;height:12px;border:1px solid rgba(0,0,0,.5);flex:0 0 auto}
.tips{font-size:11px;line-height:1.9;color:var(--dim);margin:0}
.tips.hl{color:var(--accent)}

#save-code{
  width:100%;height:56px;resize:none;padding:8px;display:block;
  font-family:inherit;font-size:11px;line-height:1.5;letter-spacing:0;
  background:#101015;border:2px solid var(--line);color:var(--text);
  word-break:break-all;user-select:text;-webkit-user-select:text;
}
.save-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.save-row .mini{flex:1 1 auto}

#hint{
  position:absolute;left:0;right:0;bottom:calc(132px + var(--safe-b));z-index:4;
  text-align:center;font-size:11px;color:#6a6a75;letter-spacing:1px;
  pointer-events:none;transition:opacity .8s;padding:0 16px;
}
#hint.gone{opacity:0}

@media (min-width:640px){
  #pet{width:128px;height:96px}
  #hud{font-size:12px;max-width:320px}
  .act{font-size:10px;min-height:64px}
  .act .ico{font-size:21px}
  .chip{font-size:13px;min-height:42px}
  #hint{font-size:12px}
  #sheet{max-height:58%}
}
@media (max-width:380px){
  .act{min-height:54px}
  .act .lbl{display:none}
}
@media (max-height:560px){
  #pet{width:88px;height:66px;top:38%}
  #stage.sheet-open #pet{top:20%}
  .act{min-height:48px}
  .act .ico{font-size:16px}
  .chip{min-height:34px;font-size:11px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="stage">

  <div id="topbar">
    <div id="hud">
      <div class="line1">♥ <b id="hud-love">0</b> · <i id="hud-lv">Lv.1 陌生</i></div>
      <div class="bar"><span id="bar-fill"></span></div>
      <div id="hud-next">距离 Lv.2「熟悉」还差 12</div>
      <div id="hud-days"></div>
    </div>
    <button id="btn-wardrobe" aria-label="小屋">👗</button>
  </div>

  <div id="pet" data-outfit="none" data-prop="none">
    <div class="shadow"></div>
    <div class="flip">
      <div class="bob">

/* ---------------- 存档 ---------------- */
function readPref(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function writePref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function readLove() { try { return Number(localStorage.getItem('pixel-pet-love')) || 0; } catch (e) { return 0; } }

const S = {
  offset: 0, face: 1, asleep: false, typing: false,
  love: readLove(),
  outfit: readPref('pixel-pet-outfit', 'none'),
  prop:   readPref('pixel-pet-prop', 'none'),
  followMe: false, cd: {}, t: {}, rafWalk: 0,
};

function levelIndexOf(v) { let i = 0; for (let k = 0; k < LEVELS.length; k++) if (v >= LEVELS[k].at) i = k; return i; }
function levelAt(lv) { const t = LEVELS.find(x => x.lv === lv); return t ? t.at : 0; }
function tierIndex() { const li = levelIndexOf(S.love); return li <= 1 ? 0 : li <= 3 ? 1 : 2; }

function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function clampOffset(v) {
  const max = Math.max(40, window.innerWidth / 2 - (window.innerWidth < 400 ? 58 : 76));
  return Math.max(-max, Math.min(max, v));
}
function applyPos() { pet.style.left = 'calc(50% + ' + S.offset.toFixed(1) + 'px)'; }
function setFace(dir) { S.face = dir < 0 ? -1 : 1; pet.style.setProperty('--face', String(S.face)); }

function say(text, ms = 1600) {
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(S.t.bubble);
  S.t.bubble = setTimeout(() => bubble.classList.remove('show'), ms);
}
function sayRandom(key) {
  const t = LINES[key];
  if (!t) return;
  const arr = t[Math.min(tierIndex(), t.length - 1)];
  if (arr && arr.length) say(pick(arr));
}

function fx(text, kind = 'code') {
  const el = document.createElement('div');
  el.className = 'fx ' + kind;
  el.textContent = text;
  const r = pet.getBoundingClientRect();
  el.style.left = (r.left + r.width / 2 + (Math.random() * 30 - 15)) + 'px';
  el.style.top  = (r.top + 6) + 'px';
  stage.appendChild(el);
  setTimeout(() => el.remove(), 1450);
}
function burst(cx, cy, n = 8, big = false) {
  const r = pet.getBoundingClientRect();
  cx = cx == null ? r.left + r.width / 2 : cx;
  cy = cy == null ? r.top + r.height / 2 : cy;
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'burst' + (big ? ' big' : '');
    const a = (Math.PI * 2 * i) / n + Math.random() * .4;
    const dist = (big ? 36 : 26) + Math.random() * (big ? 44 : 24);
    d.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px');
    d.style.setProperty('--dy', (Math.sin(a) * dist).toFixed(0) + 'px');
    d.style.left = cx + 'px';
    d.style.top  = cy + 'px';
    d.style.background = BURST_COLORS[i % BURST_COLORS.length];
    stage.appendChild(d);
    setTimeout(() => d.remove(), big ? 1000 : 720);
  }
}
function crumbs(cx, cy, colors) {
  const cols = colors || ['#e0a860','#c98b45','#f0c48a'];
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'burst';
    const a = Math.random() * Math.PI * 2;
    const dist = 9 + Math.random() * 15;
    d.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px');
    d.style.setProperty('--dy', (Math.sin(a) * dist + 10).toFixed(0) + 'px');
    d.style.left = cx + 'px';
    d.style.top  = cy + 'px';
    d.style.background = cols[i % cols.length];
    stage.appendChild(d);
    setTimeout(() => d.remove(), 720);
  }
}
function puffs(cx, cy) {
  const d = document.createElement('div');
  d.className = 'puff';
  d.style.left = cx + 'px';
  d.style.top  = cy + 'px';
  stage.appendChild(d);
  setTimeout(() => d.remove(), 1300);
}

function showGain(n) {
  const el = document.createElement('div');
  el.className = 'gainfx';
  el.textContent = (n > 0 ? '+' : '') + n;
  const r = hudLove.getBoundingClientRect();
  el.style.left = (r.right + 8) + 'px';
  el.style.top  = (r.top - 2) + 'px';
  stage.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
function updateHud() {
  const i = levelIndexOf(S.love);
  const cur = LEVELS[i], next = LEVELS[i + 1];
  hudLove.textContent = S.love;
  hudLv.textContent = 'Lv.' + cur.lv + ' ' + cur.title;
  if (next) {
    const p = (S.love - cur.at) / (next.at - cur.at);
    barFill.style.width = Math.max(0, Math.min(1, p)) * 100 + '%';
    hudNext.textContent = '距离 Lv.' + next.lv + '「' + next.title + '」还差 ' + (next.at - S.love);
  } else {
    barFill.style.width = '100%';
    hudNext.textContent = '已经是心意相通了 ♥';
  }
}
function gain(key, pts, cd) {
  const r = REWARD[key] || { pts: 1, cd: 3000 };
  const p = pts != null ? pts : r.pts;
  const c = cd != null ? cd : r.cd;
  const now = performance.now();
  if (now - (S.cd[key] || 0) < c) return false;
  S.cd[key] = now;
  applyLove(p);
  return true;
}
function applyLove(delta) {
  const before = levelIndexOf(S.love);
  S.love = Math.max(0, S.love + delta);
  const after = levelIndexOf(S.love);
  writePref('pixel-pet-love', String(S.love));
  updateHud();
  if (delta) showGain(delta);
  if (after > before) onLevelUp(before, after);
}
function onLevelUp(before, after) {
  if (S.asleep) wake();
  refreshSecrets();
  playSwap();
  burst();
  buzz(60);
  for (let i = before + 1; i <= after; i++) queueToast(LEVELS[i]);
  const top = LEVELS[after];
  if (top) say(top.say, 3200);
}
const toastQueue = [];
let toastBusy = false;
function queueToast(level) { toastQueue.push(level); if (!toastBusy) nextToast(); }
function nextToast() {
  const lv = toastQueue.shift();
  if (!lv) { toastBusy = false; return; }
  toastBusy = true;
  $id('toast-title').textContent = 'Lv.' + lv.lv + '  ' + lv.title;
  toastBody.textContent = lv.note;
  toast.classList.remove('hide');
  burst();
  setTimeout(() => {
    toast.classList.add('hide');
    setTimeout(nextToast, 320);
  }, 2300);
}

function doKiss() {
  if (S.typing) return say('它在敲代码,等它忙完嘛~');
  if (S.asleep) { wake(); say('唔…?!', 1100); }

  const first = !readPref('pixel-pet-kissed', '');
  const tier  = tierIndex();
  const k = first ? KISS.first : (tier === 0 ? KISS.shy : tier === 1 ? KISS.happy : KISS.deep);

  const r = pet.getBoundingClientRect();
  const faceX = r.left + r.width * 0.66;
  const faceY = r.top + r.height * 0.46;

  kiss.textContent = '💋';
  kiss.style.left = faceX + 'px';
  kiss.style.top  = faceY + 'px';
  stage.appendChild(kiss);
  setTimeout(() => kiss.remove(), 720);

  clearTimeout(S.t.kiss);
  S.t.kiss = setTimeout(() => {
    oneShot(k.cls, k.dur, null);
    say(pick(k.lines), 2400);
    fx('啾~', 'kiss');
    if (tier === 0 && !first) fx('💦', 'kiss');
    for (let i = 0; i < k.hearts; i++) setTimeout(() => fx('♥', 'heart'), 120 + i * 200);
    if (first || tier === 2) setTimeout(() => burst(faceX, faceY - 8, 10), 380);
    buzz(first ? 55 : 26);

    if (first) writePref('pixel-pet-kissed', '1');
    gain('kiss', k.pts, k.cd);

    clearTimeout(S.t.wander);
    cancelAnimationFrame(S.rafWalk);
    clearTimeout(S.t.kissBack);
    S.t.kissBack = setTimeout(() => wander(700), k.dur + 500);
  }, 360);
}

/* ---------------- 存档码 ---------------- */
function buildSaveCode() {
  return ['PET1', S.love, S.outfit, S.prop, readPref('pixel-pet-kissed', '') ? 1 : 0,
          readPref('pixel-pet-first-day', '')].join('|');
}
function refreshSaveBox() { saveBox.value = buildSaveCode(); }
function copySave() {
  refreshSaveBox();
  saveBox.focus();
  saveBox.select();
  if (saveBox.setSelectionRange) saveBox.setSelectionRange(0, 99999);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(saveBox.value).then(() => {}, () => {});
    ok = true;
  }
  say(ok ? '复制好了,发到新手机上就行' : '复制失败,长按框里的字手动复制', 2400);
}
function importSave() {
  const txt = (saveBox.value || '').trim();
  if (!txt) { refreshSaveBox(); return say('框里还没有存档码呢,先粘贴进去', 2200); }
  if (txt === buildSaveCode()) return say('这就是现在的存档呀', 1800);
  const p = txt.split('|');
  if (p[0] !== 'PET1' || p.length < 5) return say('这串码看不懂…再检查一下?', 2200);
  const love = Math.max(0, Math.floor(Number(p[1]) || 0));
  const outfit = OUTFITS.some(o => o.id === p[2]) ? p[2] : 'none';
  const prop   = PROPS.some(x => x.id === p[3]) ? p[3] : 'none';
  S.love = love;
  writePref('pixel-pet-love', String(love));
  writePref('pixel-pet-kissed', p[4] === '1' ? '1' : '');
  if (p[5]) writePref('pixel-pet-first-day', p[5]);
  setOutfit(outfit, true);
  setProp(prop, true);
  S.cd = {};
  updateHud(); refreshSecrets(); refreshSaveBox();
  playSwap(); burst(); buzz(30);
  say('搬家搬好了,好久不见~', 2400);
}
function clearSave() {
  if (!window.confirm('清空存档?亲密度、衣服、第一次亲亲的记忆、认识的天数都会归零。')) return;
  S.love = 0; S.followMe = false; S.cd = {};
  writePref('pixel-pet-love', '0');
  writePref('pixel-pet-kissed', '');
  writePref('pixel-pet-first-day', '');
  setOutfit('none', true);
  setProp('none', true);
  updateHud(); refreshSecrets(); refreshSaveBox();
  say('…那,我们重新认识一次吧', 2800);
}

/* ---------------- 零食盘 ---------------- */
function buildSnacks() {
  const grid = $id('wrow-snack');
  SNACKS.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'snack-btn';
    b.dataset.id = s.id;
    b.innerHTML =
      '<span class="s-ico">' + s.ico + '</span>' +
      '<span class="s-txt"><span>' + s.name + '</span>' +
      '<span class="s-val">+ ' + s.pts + ' 好感</span></span>' +
      '<span class="s-cd"></span>';
    b.addEventListener('click', () => feedWith(s));
    grid.appendChild(b);
  });
  refreshTray();
}
function snackLeft(s) {
  return Math.ceil((s.cd - (performance.now() - (S.cd['snack:' + s.id] || 0))) / 1000);
}
function refreshTray() {
  let anyCooling = false;
  document.querySelectorAll('#wrow-snack .snack-btn').forEach(b => {
    const s = SNACKS.find(x => x.id === b.dataset.id);
    if (!s) return;
    const left = snackLeft(s);
    const cdEl = b.querySelector('.s-cd');
    if (left > 0) {
      anyCooling = true;
      b.classList.add('cooling');
      if (cdEl) cdEl.textContent = left + 's';
    } else {
      b.classList.remove('cooling');
      if (cdEl) cdEl.textContent = '';
    }
  });
  if (!anyCooling && S.t.tray) { clearInterval(S.t.tray); S.t.tray = null; }
}
function feedWith(s) {
  if (S.asleep) { wake(); return; }
  if (S.typing) { say('它在敲代码,先别喂~'); return; }

  const left = snackLeft(s);
  if (left > 0) { say('还有点饱,再等 ' + left + ' 秒~', 1300); return; }
  S.cd['snack:' + s.id] = performance.now();

  const r = pet.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const mouthY = r.top + r.height * 0.42;

  const drop = document.createElement('div');
  drop.className = 'snack';
  drop.textContent = s.ico;
  drop.style.left = cx + 'px';
  drop.style.top  = (r.top + 2) + 'px';
  stage.appendChild(drop);
  setTimeout(() => drop.remove(), 660);

  clearTimeout(S.t.feed);
  S.t.feed = setTimeout(() => {
    oneShot(s.cls, 1500, null);
    say(pick(s.line), 1800);
    if (s.steam) {
      for (let i = 0; i < 3; i++) setTimeout(() => puffs(cx + (Math.random() * 24 - 12), mouthY - 6), i * 280);
    } else {
      for (let i = 0; i < 3; i++) setTimeout(() => crumbs(cx + (Math.random() * 30 - 15), mouthY, s.crumbs), i * 320);
    }
    const hn = s.hearts || 1;
    for (let i = 0; i < hn; i++) setTimeout(() => fx('♥', 'heart'), 140 + i * 230);
    if (s.big) setTimeout(() => burst(cx, mouthY, 12, true), 880);
    setTimeout(() => { applyLove(s.pts); buzz(s.pts >= 20 ? 40 : 22); }, 950);
  }, 560);

  const ic = feedBtn.querySelector('.ico');
  if (ic) ic.textContent = s.ico;
  refreshTray();
  clearInterval(S.t.tray);
  S.t.tray = setInterval(refreshTray, 500);
}

/* ---------------- 隐藏动作 ---------------- */
function buildSecrets() {
  const row = $id('row-secret');
  SECRETS.forEach(a => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.id = a.id;
    b.addEventListener('click', () => onSecretClick(a));
    row.appendChild(b);
  });
  refreshSecrets();
}
function refreshSecrets() {
  const li = levelIndexOf(S.love);
  document.querySelectorAll('#row-secret .chip').forEach(b => {
    const a = SECRETS.find(x => x.id === b.dataset.id);
    const ok = li >= levelIndexOf(levelAt(a.lv));
    const wasLocked = b.classList.contains('locked');
    if (ok) {
      b.classList.remove('locked');
      b.textContent = a.toggle ? (S.followMe ? '🐾 跟着我(开)' : '🐾 跟着我') : '✦ ' + a.name;
      b.classList.toggle('on', !!a.toggle && S.followMe);
      if (wasLocked) { b.classList.add('unlocked'); setTimeout(() => b.classList.remove('unlocked'), 600); }
    } else {
      b.classList.add('locked');
      b.classList.remove('on');
      b.textContent = '🔒 Lv.' + a.lv;
    }
  });
}
function onSecretClick(a) {
  if (levelIndexOf(S.love) < levelIndexOf(levelAt(a.lv))) {
    say('还没到解锁的时候哦(还差 ' + (levelAt(a.lv) - S.love) + ' 点)');
    return;
  }
  if (S.asleep) return wake();
  if (S.typing) return say('它在敲代码,先别打扰~');

  if (a.toggle) {
    S.followMe = !S.followMe;
    refreshSecrets();
    say(S.followMe ? '我跟着你走~' : '那我自己玩啦', 1500);
    buzz(20);
    if (S.followMe) { clearTimeout(S.t.wander); wander(300); }
    return;
  }

  oneShot(a.cls, a.dur, null);
  say(a.line, a.dur);
  gain('play');

  if (a.id === 'nuzzle') { fx('♥', 'heart'); setTimeout(() => fx('♥', 'heart'), 300); }
  if (a.id === 'hug') {
    fx('♥', 'heart');
    setTimeout(() => fx('♥', 'heart'), 260);
    setTimeout(() => fx('♥', 'heart'), 520);
  }
  if (a.id === 'dance') noteLoop(a.dur);
  if (a.id === 'firework') fireworkShow();

  clearTimeout(S.t.wander);
  cancelAnimationFrame(S.rafWalk);
  clearTimeout(S.t.secret);
  S.t.secret = setTimeout(() => wander(500), a.dur + 100);
}
function noteLoop(ms) {
  const notes = ['♪', '♫', '♬'];
  clearInterval(S.t.note);
  S.t.note = setInterval(() => fx(pick(notes), 'note'), 260);
  setTimeout(() => clearInterval(S.t.note), ms);
}
function fireworkShow() {
  const r = pet.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top;
  for (let wave = 0; wave < 3; wave++) {
    setTimeout(() => {
      const ox = cx + (wave - 1) * 52 * (0.7 + Math.random() * 0.6);
      const oy = cy - 26 - wave * 26 + Math.random() * 16;
      burst(ox, oy, 14, true);

}

function oneShot(cls, ms, lineKey) {
  ONE_SHOT.forEach(c => pet.classList.remove(c));
  void pet.offsetWidth;
  cls.split(' ').forEach(c => pet.classList.add(c));
  clearTimeout(S.t.action);
  S.t.action = setTimeout(() => cls.split(' ').forEach(c => pet.classList.remove(c)), ms);
  if (lineKey) sayRandom(lineKey);
}
function doJump() {
  if (S.asleep || S.typing) return;
  oneShot('jump', 420, Math.random() < .4 ? 'jump' : null);
}
function doWiggle() {
  if (S.asleep || S.typing) return;

}

  if (S.asleep) return wake();

/* ---------------- 打盹 ---------------- */
function toggleSleep() {
  if (S.typing) stopTyping();
  if (S.asleep) return wake();
  S.asleep = true;
  cancelAnimationFrame(S.rafWalk);
  clearTimeout(S.t.wander);
  pet.classList.add('sleep');
  if (S.outfit !== 'pajama') sayRandom('sleep');
  fx('Zzz', 'zzz');
  S.t.zzz  = setInterval(() => { if (S.asleep) fx('Zzz', 'zzz'); }, 1000);
  S.t.wake = setTimeout(() => {
    if (!S.asleep) return;
    S.asleep = false;
    clearInterval(S.t.zzz);
    pet.classList.remove('sleep');
    gain('sleep');
    sayRandom('sleep');
    wander(600);
  }, 6500);
}
function wake() {
  if (!S.asleep) return;

  clearInterval(S.t.zzz);
  clearTimeout(S.t.wake);

/* ---------------- 敲代码 ---------------- */
function toggleTyping() {
  if (S.asleep) return wake();
  if (S.typing) stopTyping(); else startTyping();
}
function startTyping() {
  if (S.asleep || S.typing) return;
  S.typing = true;
  cancelAnimationFrame(S.rafWalk);
  clearTimeout(S.t.wander);
  pet.classList.add('typing');
  typeBtn.classList.add('on');

}
function stopTyping() {

/* ---------------- 走路 / 跟随 ---------------- */
function wander(delay) {
  clearTimeout(S.t.wander);
  if (S.asleep || S.typing) return;
  let d = delay != null ? delay : 900 + Math.random() * 2200;
  if (S.followMe && pointerReady) d = 420;
  S.t.wander = setTimeout(walkOnce, d);
}
function walkTo(target, onDone) {
  const from = S.offset;
  const delta = target - from;
  if (Math.abs(delta) < 4) { if (onDone) onDone(); return; }
  setFace(delta);
  const dur = Math.abs(delta) * WALK_SPEED + 380;
  const t0 = performance.now();
  cancelAnimationFrame(S.rafWalk);
  const step = (now) => {
    if (S.asleep || S.typing) return;
    const t = Math.min(1, (now - t0) / dur);
    S.offset = from + delta * t;
    applyPos();
    if (t < 1) S.rafWalk = requestAnimationFrame(step);
    else if (onDone) onDone();
  };
  S.rafWalk = requestAnimationFrame(step);
}
function followTarget() {
  const px = clampOffset(pointer.x - window.innerWidth / 2);
  return clampOffset(S.offset <= px ? px - 36 : px + 36);
}
function walkOnce() {
  if (S.asleep || S.typing) return;
  if (S.followMe && pointerReady) {
    const target = followTarget();
    if (Math.abs(target - S.offset) < 18) return wander(420);
    walkTo(target, () => wander(420));
  } else {
    const span = Math.min(window.innerWidth * 0.6, 560);
    walkTo(clampOffset((Math.random() - 0.5) * span), () => wander());
  }
}

/* ---------------- 眨眼 ---------------- */
function blinkLoop() {
  S.t.blink = setTimeout(() => {
    if (!S.asleep) {
      pet.classList.add('blink');

}

/* ---------------- 视线 + 气泡 ---------------- */
const pointer = { x: window.innerWidth / 2, y: window.innerHeight * 0.4 };
let pointerReady = false;
function pointAt(x, y) { pointer.x = x; pointer.y = y; pointerReady = true; }
window.addEventListener('pointermove', (e) => { pointAt(e.clientX, e.clientY); }, { passive: true });

function followLoop() {
  const r  = pet.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height * 0.45;
  const dx = pointer.x - cx, dy = pointer.y - cy;
  const len = Math.hypot(dx, dy) || 1;
  const k   = Math.min(1, len / 130);
  const ex = (dx / len) * k * 1.6 * S.face;
  const ey = (dy / len) * k * 1.1;
  for (const el of eyes) {
    el.style.setProperty('--ex', ex.toFixed(2) + 'px');
    el.style.setProperty('--ey', ey.toFixed(2) + 'px');
  }
  bubble.style.left = cx + 'px';
  bubble.style.top  = (r.top - 8) + 'px';
  S.t.follow = setTimeout(followLoop, 70);
}

/* ================= PWA:图标 / 安装 / 离线 ================= */

function paintIcon(ctx, size) {
  const u = size / 32, s = 0.78, ox = 3.52, oy = 2.35;
  const R = (x, y, w, h, c) => {
    ctx.fillStyle = c;
    ctx.fillRect((x * s + ox) * u, (y * s + oy) * u, w * s * u, h * s * u);
  };
  ctx.fillStyle = '#17171b';
  ctx.fillRect(0, 0, size, size);
  R(0, 13, 3, 5, '#e08e73'); R(29, 13, 3, 5, '#e08e73');
  R(3, 8, 26, 16, '#e5977c');
  R(5, 24, 3, 3, '#e5977c'); R(11, 24, 3, 3, '#e5977c');
  R(18, 24, 3, 3, '#e5977c'); R(24, 24, 3, 3, '#e5977c');
  R(8, 13, 3, 5, '#1a1a1a'); R(21, 13, 3, 5, '#1a1a1a');
  R(4, 15.5, 2.5, 1.5, '#ff8fa8'); R(25.5, 15.5, 2.5, 1.5, '#ff8fa8');
}
function makeTouchIcon() {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    paintIcon(c.getContext('2d'), 180);
    const url = c.toDataURL('image/png');
    const add = (rel) => {
      const l = document.createElement('link');
      l.rel = rel; l.href = url;
      if (rel === 'apple-touch-icon') l.sizes = '180x180';
      document.head.appendChild(l);
    };
    add('apple-touch-icon');
    add('icon');
  } catch (e) {}
}

const isStandalone = () =>
  window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () =>
  /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let deferredPrompt = null;
const installBtn = $id('btn-install');
const installTip = $id('install-tip');

function paintInstall() {
  if (!installBtn || !installTip) return;
  if (isStandalone()) {
    installBtn.hidden = true;

  }
  installBtn.textContent = isIOS() ? '📲 怎么装到主屏?' : '📲 安装到桌面';
  installTip.textContent = isIOS()
    ? 'iPhone:用 Safari 打开本页 → 点底部「分享」→ 往下滑找「添加到主屏幕」。'
    : '浏览器菜单(⋮ / 分享)里选「安装应用」或「添加到主屏幕」。';
}

installBtn && installBtn.addEventListener('click', async () => {
  if (isStandalone()) return;
  if (deferredPrompt) {
    deferredPrompt.prompt();

      const r = await deferredPrompt.userChoice;

  installTip.classList.add('hl');
  setTimeout(() => installTip.classList.remove('hl'), 2600);
});

window.addEventListener('beforeinstallprompt', (e) => {

});

<script>
/* ============ 它记得你走了多久 + 今天是认识你的第几天 ============ */
(function () {
  var K_SEEN = 'pixel-pet-last-seen', K_FIRST = 'pixel-pet-first-day', K_LOVE = 'pixel-pet-love';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* 走了多久要说的话:六档时长 × 三档亲密度 */
  var AWAY = [
    { ms: 3 * 86400000, t: ['…你回来了啊。({g})', '{g}…我都快忘了你长什么样了', '你走了 {g}…我还以为你不要我了'] },
    { ms: 86400000,     t: ['{g}不见。', '{g}…我一个人待了好久。', '{g}。你终于回来了…我一直在这儿等你'] },
    { ms: 6 * 3600000,  t: ['{g}。', '你走了 {g},我打了个盹。', '你走了 {g}…好长啊。不过你回来就好 ♥'] },
    { ms: 3600000,      t: ['你出去 {g} 了呀。', '等了你 {g}…', '你走了 {g}…我一直看着时间'] },
    { ms: 5 * 60000,    t: ['{g}没见。', '{g}呀,你去忙了吧?', '{g}…我还以为你去别人那儿了'] },
    { ms: 60000,        t: ['你回来啦。', '你回来啦~', '欢迎回来 ♥'] }
  ];
  /* 认识第几天要说的话 */
  var DAY = {
    d1:   ['今天是第 1 天…请多指教', '第 1 天。以后也请多关照', '第 1 天…你就是我的主人了吗'],
    d2:   ['今天是第 2 天呢', '第 2 天~你还在', '第 2 天…昨天我还以为你不会再来'],
    week: ['我们认识一周啦!', '满 7 天了…时间过得好快', '第 7 天 ♥ 已经习惯你在身边了'],
    d30:  ['一个月了…!', '第 30 天。你陪我好久', '整整一个月…以后还有好多个月'],
    d100: ['第 100 天!', '100 天了…我们一起走过好多', '第 100 天 ♥ 想和你走更久'],
    d365: ['一年了…', '第 365 天', '一年了…谢谢你一直没走'],
    any:  ['今天是认识你的第 {g} 天', '第 {g} 天了', '…第 {g} 天。还有好多天要走']
  };

  function fmt(ms) {
    var m = Math.max(1, Math.round(ms / 60000));
    if (m < 60) return m + ' 分钟';
    var h = Math.floor(m / 60), mm = m % 60;
    if (h < 24) return mm ? h + ' 小时 ' + mm + ' 分钟' : h + ' 小时';
    var d = Math.floor(h / 24), hh = h % 24;
    return hh ? d + ' 天 ' + hh + ' 小时' : d + ' 天';
  }
  function tier() { var v = Number(get(K_LOVE)) || 0; return v >= 100 ? 2 : v >= 30 ? 1 : 0; }
  function lineOf(arr, g) { return arr[Math.min(tier(), 2)].replace('{g}', g); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ===== ① 认识第几天 ===== */
  var firstRaw = get(K_FIRST);
  if (!firstRaw) { firstRaw = String(Date.now()); set(K_FIRST, firstRaw); }
  var firstTs = Number(firstRaw) || Date.now();
  var qd = new URLSearchParams(location.search).get('day');    /* 测试:?day=100 */
  if (qd) firstTs = Date.now() - ((parseInt(qd, 10) || 1) - 1) * 86400000;
  var a0 = new Date(), b0 = new Date(firstTs);
  a0.setHours(0, 0, 0, 0); b0.setHours(0, 0, 0, 0);
  var dayN = Math.round((a0 - b0) / 86400000) + 1;
  if (dayN < 1) dayN = 1;

  var hudDays = document.getElementById('hud-days');
  if (hudDays) hudDays.innerHTML = '认识你的第 <b>' + dayN + '</b> 天';

  var dKey = dayN === 1 ? 'd1' : dayN === 2 ? 'd2' : dayN === 7 ? 'week' : dayN === 30 ? 'd30'
           : dayN === 100 ? 'd100' : dayN === 365 ? 'd365' : (Math.random() < .4 ? 'any' : null);
  var dayText = dKey ? lineOf(DAY[dKey], dayN) : null;

  /* ===== ② 走了多久 ===== */
  var last = Number(get(K_SEEN)) || 0;
  var qa = new URLSearchParams(location.search).get('away');   /* 测试:?away=3h / ?away=2d */
  if (qa) {
    var num = parseFloat(qa) || 0;
    var unit = /d/.test(qa) ? 86400000 : /h/.test(qa) ? 3600000 : 60000;
    last = Date.now() - num * unit;
  }
  var awayText = null, awayLong = false;
  if (last) {
    var gap = Date.now() - last;
    if (gap >= 60000) {
      var rule = null;
      for (var i = 0; i < AWAY.length; i++) { if (gap >= AWAY[i].ms) { rule = AWAY[i]; break; } }
      if (rule) { awayText = lineOf(rule.t, fmt(gap)); awayLong = gap > 6 * 3600000 && tier() === 2; }
    }
  }

  /* ===== ③ 会说、还会赖着不走(防止被别的计时器提前藏起来) ===== */
  function say(t, ms) {
    var b = document.getElementById('bubble');
    if (!b) return;
    var end = Date.now() + (ms || 6000);
    b.textContent = t;
    b.classList.add('show');
    clearInterval(say.k);
    say.k = setInterval(function () {
      if (Date.now() > end) { clearInterval(say.k); b.classList.remove('show'); return; }
      if (b.textContent === t && !b.classList.contains('show')) b.classList.add('show');
    }, 150);
  }
  function heart() {
    var st = document.getElementById('stage'), p = document.getElementById('pet');
    if (!st || !p) return;
    var r = p.getBoundingClientRect();
    var d = document.createElement('div');
    d.className = 'fx heart';
    d.textContent = '♥';
    d.style.left = (r.left + r.width / 2 + (Math.random() * 30 - 15)) + 'px';
    d.style.top = (r.top + 6) + 'px';
    st.appendChild(d);
    setTimeout(function () { d.remove(); }, 1500);
  }

  /* ===== ④ 依次说:先说走了多久(7 秒),再说第几天(5 秒) ===== */
  var when = awayText ? 4200 : 2200;
  if (awayText) {
    (function (txt, ms, long) {
      setTimeout(function () {
        say(txt, ms);
        if (long) for (var k = 0; k < 3; k++) setTimeout(heart, k * 260);
      }, when);
    })(awayText, 7000, awayLong);
    when += 7400;
  }
  if (dayText) {
    (function (txt) { setTimeout(function () { say(txt, 5000); }, when); })(dayText);
  }

  /* ===== ⑤ 离开时把时间记下来 ===== */
  function stamp() { set(K_SEEN, String(Date.now())); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stamp(); });
  window.addEventListener('pagehide', stamp);
  setTimeout(stamp, 3000);
  setInterval(stamp, 30000);
})();
</script>
</body>
</html>
